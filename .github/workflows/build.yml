
name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # =========================
      # NODE.JS
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="

          curl -fL \
            --retry 3 \
            --retry-delay 3 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip

          echo "=== File Info ==="
          ls -lh project.zip
          file project.zip

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            exit 1
          fi

          echo "✅ ZIP valid"

          unzip -q project.zip -d project_raw

          echo "=== Project Files ==="
          find project_raw | head -50

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"

      # =========================
      # JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # =========================
      # ANALYZE PROJECT
      # =========================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true

            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"

            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "Native Android project detected."
            echo "[END_RESULT_ANALYZE]"
          fi

      # =========================
      # STOP ANALYZE ONLY
      # =========================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode completed."
          exit 0

      # =========================
      # FLUTTER DOCTOR
      # =========================
      - name: Flutter Doctor
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: flutter doctor

      # =========================
      # GET DEPENDENCIES
      # =========================
      - name: Get dependencies
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Running flutter pub get ==="

          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          else
            echo "Native Android project detected."
          fi

      # =========================
      # BUILD APK
      # =========================
      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"

          if [ -f "pubspec.yaml" ]; then

            if [ "${{ github.event.inputs.build_type }}" = "release" ]; then

              echo "Building Flutter Release APK"

              flutter build apk \
                --release \
                --obfuscate \
                --split-debug-info=build/debug-info

            else

              flutter build apk --debug

            fi

          else

            echo "Native Android project detected."

            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)

            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ gradlew tidak ditemukan!"
              exit 1
            fi

            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"

            chmod +x gradlew

            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi

          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "=== APK Output Scanning ==="

          APK_FOUND=$(find "$GITHUB_WORKSPACE" \
            -name "*.apk" \
            -not -path "*/build/debug-info/*" \
            | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_FOUND")

          APK_MB=$(awk \
            "BEGIN {printf \"%.2f\", $APK_SIZE/1048576}")

          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"
          echo "APK_SIZE_MB=$APK_MB" >> "$GITHUB_ENV"

          echo "APK: $APK_FOUND"
          echo "Size: $APK_MB MB"

          ls -lh "$APK_FOUND"

      # =========================
      # APK CONTENT ANALYSIS
      # =========================
      - name: Analyze APK Contents
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "=== APK CONTENT ANALYSIS ==="

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

          echo ""
          echo "=== TOP 30 LARGEST FILES ==="

          unzip -l "$APK_PATH" | sort -k1,1nr | head -30

          echo ""
          echo "=== NATIVE LIBRARIES ==="

          unzip -l "$APK_PATH" | grep 'lib/.*\.so' || true

          echo ""
          echo "=== ASSETS ==="

          unzip -l "$APK_PATH" | grep 'assets/' | head -30 || true

          echo ""
          echo "=== APK SIZE ==="

          ls -lh "$APK_PATH"

      # =========================
      # VERIFY APK INTEGRITY
      # =========================
      - name: Verify APK Integrity
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "=== Verifying APK ==="

          if ! unzip -t "$APK_PATH" > /dev/null 2>&1; then
            echo "❌ APK integrity check failed!"
            exit 1
          fi

          echo "✅ APK integrity valid"

      # =========================
      # FINAL APK REPORT
      # =========================
      - name: Final APK Report
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "================================"
          echo "       FINAL BUILD REPORT"
          echo "================================"

          echo "Build Type: ${{ github.event.inputs.build_type }}"
          echo "Tag: ${{ github.event.inputs.tag }}"
          echo "APK: $APK_PATH"
          echo "Size: $APK_SIZE_MB MB"

          echo "================================"

      # =========================
      # UPLOAD APK ARTIFACT
      # =========================
      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
